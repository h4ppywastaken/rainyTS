Update=250
AccurateText=1
BackgroundMode=Transparent
OnRefreshAction=[!ZPos 2][!CommandMeasure MeasureRunTS6 "Run"]
ContextTitle=Edit settings
ContextAction=["#@#Settings.inc"]

[Metadata]
Name=rainyTS
Author=rainyTS
Version=1.1.0
License=MIT
Information=TeamSpeak 6 channel voice overlay

[Variables]
