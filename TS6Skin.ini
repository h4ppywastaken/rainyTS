; ----- Lua script measure (reads TS6Data.txt, updates UI) -----
[MeasureLua]
Measure=Script
ScriptFile=#@#Script.lua
UpdateDivider=1

; ----- PowerShell back-end (connects to TS6 Remote Apps) -----
[MeasureRunTS6]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#TS6Client.ps1" -HostAddr "#TS6_Host#" -Port #TS6_Port# -Quiet
State=Hide
OutputType=UTF8
; Restart the back-end if it ever exits or crashes. "Run" is a no-op while
; the process is still running, so this cannot start a second copy.
FinishAction=[!Delay 5000][!CommandMeasure MeasureRunTS6 "Run"]
DynamicVariables=1

; ==================== CARD ====================

[MeterBG]
Meter=Shape
X=0
Y=0
; Two translucent layers form a soft drop shadow under the card.
Shape=Rectangle (#Margin#-3),(#Margin#),(#SkinWidth#+6),(#BGHeight#+5),(#CornerRadius#+3) | Fill Color #ColorShadowSoft# | StrokeWidth 0
Shape2=Rectangle (#Margin#-1),(#Margin#+2),(#SkinWidth#+2),(#BGHeight#+1),(#CornerRadius#+1) | Fill Color #ColorShadow# | StrokeWidth 0
Shape3=Rectangle #Margin#,#Margin#,#SkinWidth#,#BGHeight#,#CornerRadius# | Fill LinearGradient BGGradient | StrokeWidth 1 | Stroke Color #ColorBorder#
; Faint top-edge highlight
Shape4=Line (#Margin#+#CornerRadius#),(#Margin#+1),(#Margin#+#SkinWidth#-#CornerRadius#),(#Margin#+1) | StrokeWidth 1 | Stroke Color #ColorHighlight#
BGGradient=90 | #ColorBGTop# ; 0.0 | #ColorBGBottom# ; 1.0
Hidden=1
DynamicVariables=1

; ==================== HEADER ====================

[MeterHeaderIcon]
Meter=String
MeterStyle=StyleIcon
Group=Header
FontSize=11
FontColor=#ColorAccent#
StringAlign=LeftCenter
X=(#Margin# + #PaddingX#)
Y=(#Margin# + #PaddingY# + 11)
Text=[\xE767]
Hidden=1

[MeterChannelName]
Meter=String
MeterStyle=StyleChannel
Group=Header
X=(#Margin# + #PaddingX# + 22)
Y=(#Margin# + #PaddingY# + 11)
Text=
Hidden=1

[MeterCountPill]
Meter=Shape
Group=Header
X=(#Margin# + #SkinWidth# - #PaddingX# - #PillWidth#)
Y=((#Margin# + #PaddingY# + 11) - 9)
Shape=Rectangle 0,0,#PillWidth#,18,9 | Fill Color #ColorPill# | StrokeWidth 0
Hidden=1
DynamicVariables=1

[MeterCountIcon]
Meter=String
MeterStyle=StyleIcon
Group=Header
FontSize=9
FontColor=#ColorTextDim#
StringAlign=LeftCenter
X=((#Margin# + #SkinWidth# - #PaddingX# - #PillWidth#) + 7)
Y=(#Margin# + #PaddingY# + 11)
Text=[\xE716]
Hidden=1

[MeterCount]
Meter=String
MeterStyle=StyleText
Group=Header
FontSize=(#FontSize# - 1)
FontWeight=600
FontColor=#ColorText#
StringAlign=RightCenter
X=((#Margin# + #SkinWidth# - #PaddingX# - #PillWidth#) + #PillWidth# - 8)
Y=(#Margin# + #PaddingY# + 11)
Text=0
Hidden=1

[MeterDivider]
Meter=Shape
Group=Header
X=(#Margin# + #PaddingX#)
Y=(#Margin# + #PaddingY# + #HeaderHeight# - 5)
Shape=Line 0,0,(#SkinWidth# - #PaddingX# * 2),0 | StrokeWidth 1 | Stroke Color #ColorDivider#
Hidden=1
DynamicVariables=1

; ==================== USER ROWS (24 slots) ====================
; Colors, text and visibility are set per row by Script.lua.

[MeterUserRow1]
Meter=Shape
Group=Row1
X=(#Margin# + #PaddingX# - 6)
